name: Build Lecture PDFs and Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Timezone for \today / \DTMcurrenttime on the compiled slides. The
      # root-level latexmkrc sets the same value for Overleaf's builders,
      # which run in UTC; this keeps CI and Overleaf agreeing.
      TZ: America/New_York
    permissions:
      contents: write   # needed to commit compiled PDFs back to the repo
      pages: write
      id-token: write

    steps:
      # 1️⃣ Checkout repository
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Download previously built PDFs
      - name: Download previously built PDFs
        run: |
          mkdir -p public
          # Durable source of prior PDFs: the committed PDFs/ folder on main.
          cp PDFs/*.pdf public/ 2>/dev/null || true
          # Fetch PDFs from the current gh-pages branch
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- . || true
          mv *.pdf public/ 2>/dev/null || true
          git checkout main -- .

      # 2️⃣ Find all standalone .tex files in LectureSlides
      - name: Find changed lecture .tex files
        run: |
          mkdir -p build
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            # No previous commit — recompile everything
            find LectureSlides -maxdepth 1 -name "*.tex" \
              ! -path "LectureSlides/includes/*" | sort > texfiles.txt
            find Syllabus -maxdepth 1 -name "syllabus.tex" > syllabuspath.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger — recompile everything
            find LectureSlides -maxdepth 1 -name "*.tex" \
              ! -path "LectureSlides/includes/*" | sort > texfiles.txt
            find Syllabus -maxdepth 1 -name "syllabus.tex" > syllabuspath.txt
          else
            # --diff-filter=d drops paths deleted in this push. Without it a
            # removed or renamed deck lands in texfiles.txt and latexmk fails on
            # a file that is no longer there. Stale PDFs are handled by the
            # prune step below, not by compiling them.
            git diff --name-only --diff-filter=d HEAD~1 HEAD -- 'LectureSlides/*.tex' \
              | grep -v 'includes/' | sort > texfiles.txt
            git diff --name-only --diff-filter=d HEAD~1 HEAD -- 'Syllabus/syllabus.tex' \
              > syllabuspath.txt
          fi
          echo "Files to compile:"
          cat texfiles.txt
          cat syllabuspath.txt

      # 2.5 Cache LaTeX packages
      - name: Cache LaTeX packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: latex-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            latex-${{ runner.os }}-

      # 2.6 Cache latexmk build artifacts
      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: build
          key: latexmk-${{ runner.os }}-${{ hashFiles('LectureSlides/*.tex', 'Syllabus/syllabus.tex') }}
          restore-keys: |
            latexmk-${{ runner.os }}-

      # 3️⃣ Compile each .tex into a PDF
      - name: Compile lecture PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-upgrade texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-games texlive-pstricks texlive-pictures texlive-science texlive-bibtex-extra latexmk poppler-utils gnuplot

          while IFS= read -r texfile; do
            [ -f "$texfile" ] || { echo "Skipping missing $texfile"; continue; }
            echo "Compiling $texfile ..."
            latexmk -pdf -shell-escape -interaction=nonstopmode -halt-on-error -outdir=build "$texfile"
          done < texfiles.txt

          while IFS= read -r texfile; do
            [ -f "$texfile" ] || { echo "Skipping missing $texfile"; continue; }
            echo "Compiling $texfile ..."
            latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build "$texfile"
          done < syllabuspath.txt

      # 4️⃣ Copy PDFs to public/
      - name: Collect PDFs
        run: |
          mkdir -p public
          cp build/*.pdf public/ 2>/dev/null || true

      # 4.4 Prune PDFs whose source deck no longer exists (renamed/deleted), so
      #     they drop out of the site, the index, and PDFs/. Without this, the
      #     build cache and the PDFs/ restore re-introduce a stale deck forever.
      - name: Prune stale PDFs
        run: |
          : > valid.txt
          for t in LectureSlides/*.tex; do
            [ -e "$t" ] || continue
            echo "$(basename "${t%.tex}").pdf" >> valid.txt
          done
          [ -f Syllabus/syllabus.tex ] && echo "syllabus.pdf" >> valid.txt
          echo "Valid PDFs:"; cat valid.txt
          for f in public/*.pdf; do
            [ -e "$f" ] || continue
            bn=$(basename "$f")
            grep -qxF "$bn" valid.txt || { echo "Pruning stale $bn"; rm -f "$f"; }
          done

      # 4.5 Commit the clean compiled PDFs to main so they sync to clones via
      #     `git pull`. Runs before annotated PDFs are added to public/, so the
      #     PDFs/ folder holds only the compiled decks. continue-on-error keeps a
      #     transient push race from blocking the Pages deploy. A GITHUB_TOKEN
      #     push does not retrigger this workflow; [skip ci] is a backstop.
      - name: Commit compiled PDFs to repo
        continue-on-error: true
        run: |
          mkdir -p PDFs
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Mirror PDFs/ to the current valid set: drop decks no longer present
          # in public/ (pruned above), then copy the live ones in.
          sync_pdfs() {
            for f in PDFs/*.pdf; do
              [ -e "$f" ] || continue
              bn=$(basename "$f")
              [ -e "public/$bn" ] || rm -f "$f"
            done
            cp public/*.pdf PDFs/ 2>/dev/null || true
          }
          sync_pdfs
          git add -A PDFs
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "Update compiled slide PDFs [skip ci]"
          # Push with retry: a concurrent build or Overleaf push may have moved
          # main. Re-apply our mirror onto the latest tip and try again, so a
          # race never silently drops the PDF update.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push rejected (attempt $attempt); integrating origin/main..."
            git fetch origin main
            git reset --soft origin/main
            sync_pdfs
            git add -A PDFs
            if git diff --cached --quiet; then echo "Nothing to commit after integrate."; exit 0; fi
            git commit -m "Update compiled slide PDFs [skip ci]"
            sleep 4
          done
          echo "Could not push PDF update after retries (non-fatal)."

      # 5️⃣ Generate index.html from PDF titles
      - name: Generate index.html
        run: |
          pdf_count=$(find public -name "*.pdf" | wc -l)
          echo "Found $pdf_count PDFs in public/"
          if [ "$pdf_count" -eq 0 ]; then
            echo "ERROR: No PDFs found in public/!" && exit 1
          fi
          cat HTML/topstuff.html > public/index.html

          # Normalize a pdfinfo date to YYYY-MM-DD in the workflow's timezone
          # (America/New_York, set at job level). Accepts either the -isodates
          # form ("2026-08-13T01:48:08-04", or UTC as "...Z") or the human form
          # ("Thu Aug 13 05:48:08 2026 UTC"). Converting rather than truncating
          # matters: xournalpp stamps ModDate in UTC, so an afternoon class
          # would otherwise be dated the following day. Prints nothing if
          # unparseable.
          norm_date() {
            [ -n "$1" ] || return 0
            date -d "$1" +%F 2>/dev/null && return 0
            # Not something date(1) understands -- fall back to the leading
            # date field if the string at least starts with one.
            case "$1" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*) printf "%s" "$1" | cut -c1-10 ;;
            esac
          }

          for f in public/*.pdf; do
            filename=$(basename "$f")
            if [ "$filename" = "syllabus.pdf" ]; then
              continue
            fi

            # Decks whose source is named xx_*.tex (no lecture number) are
            # "unlisted": they still compile, deploy, and land in PDFs/, but they
            # are deliberately left off the public index. Use this for material
            # that isn't a numbered lecture -- running errata, one-off asides.
            # Note: unlisted is not private. The PDF is still on the site at its
            # direct URL and the .tex is in a public repo.
            case "$filename" in
              xx_*)
                echo "Unlisted (xx_ prefix), skipping index entry: $filename"
                continue
                ;;
            esac

            base="${filename%.pdf}"
            texfile="LectureSlides/$base.tex"

            REPO_URL="https://github.com/pauljhealy/ECON5001-GameTheory"
            BRANCH="main"

            tex_url="$REPO_URL/blob/$BRANCH/LectureSlides/$base.tex"

            raw_title=$(pdfinfo "$f" \
              | awk '/^Title:/ {flag=1; sub(/^Title:[[:space:]]*/, ""); print; next}
                     /^[[:space:]]/ && flag {print}
                     !/^[[:space:]]/ && flag {exit}')

            # Normalize
            title=$(printf "%s" "$raw_title" \
              | tr '\n' ' ' \
              | sed 's/\\\\/ /g' \
              | sed 's/[[:space:]]\+/ /g' \
              | sed 's/^ *//; s/ *$//')

            # Fallback to filename if empty
            if [ -z "$title" ]; then
              title=$(basename "$f" .pdf)
            fi

            # Get last commit date for this .tex file
            last_updated=$(git log -1 --format="%as" -- "$texfile")
            last_updated_string="(updated $last_updated)"
            if [ -z "$last_updated" ]; then
              last_updated="unknown"
              last_updated_string=""
            fi

            # Build the metadata line: updated date (if known) + source link
            if [ -n "$last_updated" ]; then
              meta="Updated $last_updated &middot; <a href=\"$tex_url\" target=\"_blank\" rel=\"noopener\">Source</a>"
            else
              meta="<a href=\"$tex_url\" target=\"_blank\" rel=\"noopener\">Source</a>"
            fi

            # Instructor's in-class annotated slides. A deck often spans more
            # than one class meeting, so a lecture can have several:
            #
            #   Annotated/<base>_PJH.pdf   whole deck covered in one meeting
            #   Annotated/<base>_PJH1.pdf  first meeting spent on this deck
            #   Annotated/<base>_PJH2.pdf  second meeting, and so on up to _PJH9
            #
            # Every file that exists gets its own dated link under the lecture.
            # The list below is already in display order: "_PJH.pdf" sorts ahead
            # of "_PJH1.pdf" because "." < "1", and a single digit keeps 1..9 in
            # numeric order. Mixing the unnumbered file with numbered ones is
            # allowed but not expected -- it would just list as an extra entry.
            #
            # The links are collected in a scratch file rather than a shell
            # variable: a multi-line string cannot be written inside a YAML
            # block scalar without ending the block.
            annot_list="${RUNNER_TEMP:-/tmp}/annot_lines.html"
            : > "$annot_list"
            for annot_file in "Annotated/${base}_PJH.pdf" "Annotated/${base}"_PJH[1-9].pdf; do
              [ -f "$annot_file" ] || continue
              annot_name=$(basename "$annot_file")
              cp "$annot_file" public/

              # Part number: "1".."9", or empty for the unnumbered file.
              part=${annot_name#"${base}_PJH"}
              part=${part%.pdf}
              if [ -n "$part" ]; then
                annot_label="&#x270E; Prof. Healy's Annotated Version (Part $part)"
              else
                annot_label="&#x270E; Prof. Healy's Annotated Version"
              fi

              # Read the metadata once. -isodates is preferred; poppler builds
              # that do not support the flag fall back to the human form, and
              # norm_date handles either.
              annot_info=$(pdfinfo -isodates "$annot_file" 2>/dev/null) || annot_info=""
              [ -n "$annot_info" ] || annot_info=$(pdfinfo "$annot_file" 2>/dev/null || true)
              annot_mod=$(printf "%s\n" "$annot_info" \
                | awk -F': +' '/^ModDate:/ {print $2; exit}')
              annot_created=$(printf "%s\n" "$annot_info" \
                | awk -F': +' '/^CreationDate:/ {print $2; exit}')

              # Which timestamp is the class meeting? NOT CreationDate: the
              # annotation app carries that over from the compiled deck, so it
              # records when latexmk built the slides -- typically the night
              # before, sometimes days earlier. ModDate is when the annotation
              # app last wrote the file, which is the class itself. Prefer it.
              annot_updated=""
              if [ -n "$annot_mod" ] && [ "$annot_mod" != "$annot_created" ]; then
                annot_updated=$(norm_date "$annot_mod")
              fi

              # ModDate identical to CreationDate means nothing ever re-stamped
              # the file: the timestamp is still the LaTeX build time, not the
              # annotation time. Same story if there is no ModDate at all. Use
              # the date the annotated PDF was committed instead.
              if [ -z "$annot_updated" ]; then
                annot_updated=$(git log -1 --format="%as" -- "$annot_file")
              fi

              # Nothing in git either (added but never committed) -- fall back
              # to the PDF's own timestamp rather than showing no date.
              if [ -z "$annot_updated" ]; then
                annot_updated=$(norm_date "$annot_mod")
              fi

              annot_date=""
              if [ -n "$annot_updated" ]; then
                annot_date=" <span class=\"lect-annot-date\">(annotated $annot_updated)</span>"
              fi

              echo "<div class=\"lect-annot-line\"><a class=\"lect-annot\" href=\"${annot_name}\" target=\"_blank\" rel=\"noopener\">${annot_label}</a>${annot_date}</div>" >> "$annot_list"
            done

            echo "<li>" >> public/index.html
            echo "<a class=\"lect-title\" href=\"$filename\" target=\"_blank\" rel=\"noopener\">$title</a>" >> public/index.html
            echo "<div class=\"lect-meta\">$meta</div>" >> public/index.html
            cat "$annot_list" >> public/index.html
            echo "</li>" >> public/index.html
          done

          echo "</ol>" >> public/index.html
          echo "</body></html>" >> public/index.html

      # 6️⃣ Deploy to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
